<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <!--O media "screen" e para um estilo que sera mostrado na tela-->
    <link rel="stylesheet" href="estilos/tela.css" media="screen">

    <link rel="stylesheet" href="estilos/impressora.css" media="print">
    <!--Por conta disso e criado dois css para que seja configurado de forma correta cada função-->
</head>
<body>

        <menu>

                <li>Esportes</li>

            </ul>
        </menu>
    </header>
    <main>
        <article>

        </article>
    </main>
</body>
</html>
