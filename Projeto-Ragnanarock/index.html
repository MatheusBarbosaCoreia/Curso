<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section id="menu">
            <h1>Ragnarock <span id="iconlogo">O</span></h1>
            <img id="celular" src="Imagens/Celular.jpg" alt="">
            <form action="" method="get" autocomplete="on">
                <p>
                    <p id="iconlogin">A</p>
                    
                    <label for="iusuario"></label>
                    <input type="text" name="usuario" id="iusuario" required placeholder="Usuario" maxlength="30">
                </p>
                <p>
                    <p id="iconsenha">P</p>
                    <label for="isenha"></label>
                    <input type="password" name="senha" id="isenha" required placeholder="Senha" minlength="8" maxlength="20">
                </p>
                <input id="registre" type="button" value="Registre-se ">
                <span id="icone1">D</span>

                <input id="login" type="submit" value="LOGIN "><span id="icone">A</span>
                <input id="continuar" type="button" value="Continuar sem login">
                <span id="icone3">e</span>
            </form>
        </section>
    </main>
</body>
</html>
